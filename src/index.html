<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互动故事引擎</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 顶部拖拽条 + 窗口控制 -->
  <div id="titlebar" data-tauri-drag-region>
    <span data-tauri-drag-region>互动故事引擎</span>
    <div class="titlebar-btns">
      <button id="win-minimize" title="最小化">&#x2013;</button>
      <button id="win-maximize" title="最大化">&#x25A1;</button>
      <button id="win-close" title="关闭">&#x2715;</button>
    </div>
  </div>

  <div id="app-wrap">
    <!-- ── 首页 ── -->
    <div id="home-screen" class="screen">
      <h1>互动故事引擎</h1>
      <div class="home-buttons">
        <button class="glass-btn" id="btn-start">选择文本开始</button>
        <button class="glass-btn" id="btn-settings">设置</button>
      </div>
    </div>

    <!-- ── 故事选择界面 ── -->
    <div id="selection-screen" class="screen sub-screen">
      <div class="screen-inner">
        <button class="back-btn" id="sel-back-btn">&larr; 返回</button>
        <h2>选择故事</h2>
        <p class="subtitle">点击一个故事开始阅读</p>
        <div class="story-list" id="story-list">
          <p class="story-list-empty">正在扫描故事文件...</p>
        </div>
      </div>
    </div>

    <!-- ── 设置界面 ── -->
    <div id="settings-screen" class="screen sub-screen">
      <div class="screen-inner">
        <button class="back-btn" id="set-back-btn">&larr; 返回</button>
        <h2>设置</h2>

        <div class="setting-item">
          <div class="setting-label">
            封面背景
            <small>选择纯色或自定义图片</small>
          </div>
          <div class="setting-control">
            <div class="color-preview" id="cover-preview" title="点击选择颜色"></div>
            <input type="color" id="cover-color-input" value="#667eea">
            <button class="img-btn" id="cover-img-btn">图片</button>
            <button class="img-btn img-clear" id="cover-img-clear" style="display:none">清除</button>
          </div>
        </div>

        <div class="setting-item">
          <div class="setting-label">
            阅读背景
            <small>选择纯色或自定义图片</small>
          </div>
          <div class="setting-control">
            <div class="color-preview" id="read-preview" title="点击选择颜色"></div>
            <input type="color" id="read-color-input" value="#fdf5e6">
            <button class="img-btn" id="read-img-btn">图片</button>
            <button class="img-btn img-clear" id="read-img-clear" style="display:none">清除</button>
          </div>
        </div>

        <p class="subtitle" style="margin-top:24px;font-size:0.85rem;">文字颜色会根据背景自动调整深浅</p>
      </div>
    </div>

    <!-- ── 故事阅读界面 ── -->
    <div id="reading-screen" class="screen">
      <div class="screen-inner">
        <button class="reading-back" id="reading-back-btn">&larr; 返回首页</button>
        <h1 id="story-title"></h1>
        <div id="story-content"></div>
        <div id="choices-container"></div>
      </div>
    </div>
  </div>

  <!-- 隐藏的图片选择器 -->
  <input type="file" id="cover-file-input" accept="image/*" style="display:none">
  <input type="file" id="read-file-input" accept="image/*" style="display:none">

  <script>
    var invoke = null;
    var currentStory = null;
    var state = { flags: {} };

    var DEFAULT_COVER = '#667eea';
    var DEFAULT_READ = '#fdf5e6';

    // ── 亮度计算 ──
    function getTextColor(hex) {
      var r = parseInt(hex.substring(1, 3), 16);
      var g = parseInt(hex.substring(3, 5), 16);
      var b = parseInt(hex.substring(5, 7), 16);
      var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.55 ? '#1a1a1a' : '#ffffff';
    }

    // ── 设置管理 ──
    function getSettings() {
      return {
        coverColor: localStorage.getItem('coverColor') || DEFAULT_COVER,
        coverImage: localStorage.getItem('coverImage') || '',
        readBg: localStorage.getItem('readBgColor') || DEFAULT_READ,
        readImage: localStorage.getItem('readImage') || ''
      };
    }

    function applySettings() {
      var s = getSettings();
      var root = document.documentElement;
      var hasCoverImg = s.coverImage !== '';
      var hasReadImg = s.readImage !== '';

      if (hasCoverImg) {
        root.style.setProperty('--cover-bg', 'url(' + s.coverImage + ')');
        root.style.setProperty('--cover-text', '#ffffff');
      } else if (s.coverColor === DEFAULT_COVER) {
        root.style.setProperty('--cover-bg', 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)');
        root.style.setProperty('--cover-text', '#ffffff');
      } else {
        root.style.setProperty('--cover-bg', s.coverColor);
        root.style.setProperty('--cover-text', getTextColor(s.coverColor));
      }

      if (hasReadImg) {
        root.style.setProperty('--read-bg', 'url(' + s.readImage + ')');
        root.style.setProperty('--read-text', '#1a1a1a');
      } else {
        root.style.setProperty('--read-bg', s.readBg);
        root.style.setProperty('--read-text', getTextColor(s.readBg));
      }

      var coverScreens = ['home-screen', 'selection-screen', 'settings-screen'];
      for (var i = 0; i < coverScreens.length; i++) {
        var el = document.getElementById(coverScreens[i]);
        if (hasCoverImg) { el.classList.add('has-image'); }
        else { el.classList.remove('has-image'); }
      }
      var readEl = document.getElementById('reading-screen');
      if (hasReadImg) { readEl.classList.add('has-image'); }
      else { readEl.classList.remove('has-image'); }

      var cp = document.getElementById('cover-preview');
      var rp = document.getElementById('read-preview');
      if (cp) cp.style.backgroundColor = s.coverColor;
      if (rp) rp.style.backgroundColor = s.readBg;

      var cc = document.getElementById('cover-img-clear');
      var rc = document.getElementById('read-img-clear');
      if (cc) cc.style.display = hasCoverImg ? '' : 'none';
      if (rc) rc.style.display = hasReadImg ? '' : 'none';
    }

    function initSettings() {
      applySettings();

      var coverPreview = document.getElementById('cover-preview');
      var coverInput = document.getElementById('cover-color-input');
      coverPreview.addEventListener('click', function() { coverInput.click(); });
      coverInput.addEventListener('input', function() {
        localStorage.setItem('coverColor', coverInput.value);
        applySettings();
      });

      var coverFileInput = document.getElementById('cover-file-input');
      document.getElementById('cover-img-btn').addEventListener('click', function() { coverFileInput.click(); });
      coverFileInput.addEventListener('change', function() {
        var file = coverFileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
          localStorage.setItem('coverImage', e.target.result);
          applySettings();
        };
        reader.readAsDataURL(file);
        coverFileInput.value = '';
      });
      document.getElementById('cover-img-clear').addEventListener('click', function() {
        localStorage.removeItem('coverImage');
        applySettings();
      });

      var readPreview = document.getElementById('read-preview');
      var readInput = document.getElementById('read-color-input');
      readPreview.addEventListener('click', function() { readInput.click(); });
      readInput.addEventListener('input', function() {
        localStorage.setItem('readBgColor', readInput.value);
        applySettings();
      });

      var readFileInput = document.getElementById('read-file-input');
      document.getElementById('read-img-btn').addEventListener('click', function() { readFileInput.click(); });
      readFileInput.addEventListener('change', function() {
        var file = readFileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
          localStorage.setItem('readImage', e.target.result);
          applySettings();
        };
        reader.readAsDataURL(file);
        readFileInput.value = '';
      });
      document.getElementById('read-img-clear').addEventListener('click', function() {
        localStorage.removeItem('readImage');
        applySettings();
      });
    }

    // ── 页面切换 ──
    var screenDisplayMap = {};
    function initScreenMap() {
      var ids = ['home-screen', 'selection-screen', 'settings-screen', 'reading-screen'];
      for (var i = 0; i < ids.length; i++) {
        var el = document.getElementById(ids[i]);
        screenDisplayMap[ids[i]] = window.getComputedStyle(el).display;
      }
    }

    function showScreen(id) {
      var screens = ['home-screen', 'selection-screen', 'settings-screen', 'reading-screen'];
      for (var i = 0; i < screens.length; i++) {
        document.getElementById(screens[i]).style.display = 'none';
      }
      document.getElementById(id).style.display = screenDisplayMap[id] || 'block';

      // 首页不滚动，其他页面允许滚动
      var wrap = document.getElementById('app-wrap');
      if (id === 'home-screen') {
        wrap.classList.remove('can-scroll');
      } else {
        wrap.classList.add('can-scroll');
      }
      wrap.scrollTop = 0;
    }

    // ── 加载故事列表 ──
    async function loadStoryList() {
      var listEl = document.getElementById('story-list');
      try {
        var stories = await invoke('scan_stories');
        if (stories.length === 0) {
          listEl.innerHTML = '<p class="story-list-empty">未找到故事文件。请将 .json 文件放入 stories 目录。</p>';
          return;
        }
        listEl.innerHTML = '';
        for (var i = 0; i < stories.length; i++) {
          (function(story) {
            var card = document.createElement('div');
            card.className = 'story-card';
            card.innerHTML = '<div class="card-title">' + story.title + '</div><div class="card-author">作者：' + story.author + '</div>';
            card.addEventListener('click', function() { startStory(story.id); });
            listEl.appendChild(card);
          })(stories[i]);
        }
      } catch (err) {
        listEl.innerHTML = '<p class="story-list-empty">扫描故事失败：' + err + '</p>';
      }
    }

    // ── 开始阅读 ──
    async function startStory(storyId) {
      try {
        currentStory = await invoke('load_story', { storyId: storyId });
        state.flags = {};
        document.getElementById('story-title').textContent = currentStory.meta.title;
        document.title = currentStory.meta.title;
        showScreen('reading-screen');
        renderNode(currentStory.startNode);
      } catch (err) {
        alert('加载故事失败：' + err);
      }
    }

    // ── 渲染节点 ──
    function renderNode(nodeId) {
      var node = currentStory.nodes[nodeId];
      if (!node) {
        document.getElementById('story-content').textContent = '错误：找不到节点 "' + nodeId + '"。';
        document.getElementById('choices-container').innerHTML = '';
        return;
      }
      document.getElementById('story-content').textContent = node.content;
      var container = document.getElementById('choices-container');
      container.innerHTML = '';

      var visible = (node.choices || []).filter(function(c) {
        if (!c.conditions) return true;
        return Object.entries(c.conditions).every(function(pair) {
          return state.flags[pair[0]] === pair[1];
        });
      });

      if (visible.length === 0) {
        var msg = document.createElement('p');
        msg.className = 'end-message';
        msg.textContent = '故事结束。';
        container.appendChild(msg);
      } else {
        for (var i = 0; i < visible.length; i++) {
          (function(choice) {
            var btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = choice.text;
            btn.addEventListener('click', function() {
              if (choice.setFlags) Object.assign(state.flags, choice.setFlags);
              renderNode(choice.nextNode);
            });
            container.appendChild(btn);
          })(visible[i]);
        }
      }
    }

    // ── 事件绑定 ──
    document.getElementById('btn-start').addEventListener('click', function() {
      showScreen('selection-screen');
      loadStoryList();
    });
    document.getElementById('btn-settings').addEventListener('click', function() {
      applySettings();
      showScreen('settings-screen');
    });
    document.getElementById('sel-back-btn').addEventListener('click', function() {
      showScreen('home-screen');
    });
    document.getElementById('set-back-btn').addEventListener('click', function() {
      showScreen('home-screen');
    });
    document.getElementById('reading-back-btn').addEventListener('click', function() {
      currentStory = null;
      state.flags = {};
      document.title = '互动故事引擎';
      showScreen('home-screen');
    });

    // ── 启动 ──
    (function() {
      initScreenMap();
      initSettings();

      var tries = 0;
      var timer = setInterval(function() {
        tries++;
        if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
          clearInterval(timer);
          invoke = window.__TAURI__.core.invoke;

          // 窗口控制
          document.getElementById('win-minimize').addEventListener('click', function() {
            invoke('minimize_window');
          });
          document.getElementById('win-maximize').addEventListener('click', function() {
            invoke('toggle_maximize');
          });
          document.getElementById('win-close').addEventListener('click', function() {
            invoke('close_window');
          });
        } else if (tries > 100) {
          clearInterval(timer);
          alert('Tauri 运行时未就绪，请重启应用。');
        }
      }, 50);
    })();
  </script>
</body>
</html>
